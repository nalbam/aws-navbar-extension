name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Includes the repository checks (tests/repo.test.js): syntax, manifests,
      # packaged files and the docs/colors.js copy.
      - name: Unit tests
        run: |
          node --test
