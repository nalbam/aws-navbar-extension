name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for f in *.js docs/*.js tests/*.js; do node --check "$f"; done

      - name: Check manifests
        run: |
          jq empty manifest.json manifest-v2.json

      - name: Check docs/colors.js is a copy of colors.js
        run: |
          cmp colors.js docs/colors.js

      - name: Unit tests
        run: |
          node --test
